server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any path that isn't a real static file falls back to index.html so
    # client-side routing (and a hard refresh mid-flow) doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html names the current hashed bundles - always revalidate it so a rebuilt
        # image is picked up on the next load instead of serving stale asset references.
        add_header Cache-Control "no-cache";
    }

    # Vite content-hashes everything under /assets, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
