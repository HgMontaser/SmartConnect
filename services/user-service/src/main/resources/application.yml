server:
  port: 8081

spring:
  application:
    name: user-service

  # Fail fast if Vault isn't reachable at boot: mandatory import (no "optional:" prefix).
  config:
    import: "vault://"

  cloud:
    vault:
      uri: ${VAULT_URI:http://vault:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN:smartconnect-root-token}
      fail-fast: true
      kv:
        enabled: true
        backend: secret
        # secret/data/smartconnect/user-service - matches infra/vault/seed.sh
        application-name: smartconnect/user-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # CorrelationIdProducerInterceptor stamps X-Correlation-Id from MDC onto every record.
        interceptor.classes: com.smartconnect.commons.kafka.CorrelationIdProducerInterceptor
        # Consumer (notification-service) sets its own value.default.type explicitly rather
        # than trusting a Java class name shipped in the record header.
        spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  elastic:
    metrics:
      export:
        enabled: true
        host: ${ELASTICSEARCH_HOST:http://elasticsearch:9200}
        index: smartconnect-metrics
        step: 30s

smartconnect:
  environment: ${SMARTCONNECT_ENV:local}

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} [correlationId=%X{correlationId}] - %msg%n"
