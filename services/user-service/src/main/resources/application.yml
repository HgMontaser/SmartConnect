server:
  port: 8081

spring:
  application:
    name: user-service

  # Secrets from Vault, shared non-secret config from Consul KV (config/application/data and
  # config/<app>/data, seeded from infra/consul/config). Both mandatory: fail fast if either
  # is unreachable at boot.
  config:
    import: "vault://,consul:"

  cloud:
    vault:
      uri: ${VAULT_URI:http://vault:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN:smartconnect-root-token}
      fail-fast: true
      kv:
        enabled: true
        backend: secret
        # secret/data/smartconnect/user-service - matches infra/vault/seed.sh
        application-name: smartconnect/user-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:19092}
    producer:
      properties:
        # CorrelationIdProducerInterceptor stamps X-Correlation-Id from MDC onto every record.
        # Serializers are set by commons (EventPublisher, permission catalog).
        interceptor.classes: com.smartconnect.commons.kafka.CorrelationIdProducerInterceptor

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  elastic:
    metrics:
      export:
        enabled: true
        host: ${ELASTICSEARCH_HOST:http://elasticsearch:9200}
        index: smartconnect-metrics
        step: 30s


# Routes api-gateway creates for this service, published via Consul metadata.
smartconnect:
  gateway:
    routes: /api/users/**,/api/roles/**,/api/permissions/**
