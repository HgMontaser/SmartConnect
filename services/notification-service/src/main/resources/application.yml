server:
  port: 8082

spring:
  application:
    name: notification-service

  # Secrets from Vault, shared non-secret config from Consul KV (config/application/data and
  # config/<app>/data, seeded from infra/consul/config). Both mandatory: fail fast if either
  # is unreachable at boot.
  config:
    import: "vault://,consul:"

  cloud:
    vault:
      uri: ${VAULT_URI:http://vault:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN:smartconnect-root-token}
      fail-fast: true
      kv:
        enabled: true
        backend: secret
        # secret/data/smartconnect/notification-service - matches infra/vault/seed.sh
        application-name: smartconnect/notification-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:19092}
    # Consumers come from commons' event listener factory (group = this service's name).

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  elastic:
    metrics:
      export:
        enabled: true
        host: ${ELASTICSEARCH_HOST:http://elasticsearch:9200}
        index: smartconnect-metrics
        step: 30s


# Routes api-gateway creates for this service, published via Consul metadata.
smartconnect:
  gateway:
    routes: /ws/**
    scheme: ws
