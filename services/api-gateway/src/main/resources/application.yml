server:
  port: 8090

spring:
  application:
    name: api-gateway

  # Secrets from Vault, shared non-secret config from Consul KV (config/application/data and
  # config/api-gateway/data, seeded from infra/consul/config). Both mandatory (no "optional:"
  # prefix), so a dead Vault or Consul aborts startup instead of degrading silently.
  config:
    import: "vault://,consul:"

  cloud:
    vault:
      uri: ${VAULT_URI:http://vault:8200}
      # Auth (the service's own AppRole) is set up by commons from the mounted credential files.
      fail-fast: true
      kv:
        enabled: true
        backend: secret
        # secret/data/smartconnect/api-gateway - matches infra/vault/seed.sh
        application-name: smartconnect/api-gateway

    # No static routes: every route comes from a service registered in Consul with
    # smartconnect.gateway.routes (see DiscoveredRoutesLocator).

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  elastic:
    metrics:
      export:
        enabled: true
        host: ${ELASTICSEARCH_HOST:http://elasticsearch:9200}
        index: smartconnect-metrics
        step: 30s
