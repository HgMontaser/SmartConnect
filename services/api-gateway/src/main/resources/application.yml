server:
  port: 8090

spring:
  application:
    name: api-gateway

  # Fail fast if Vault isn't reachable at boot: spring.config.import is mandatory (no
  # "optional:" prefix), so a dead Vault aborts startup instead of degrading silently.
  config:
    import: "vault://"

  cloud:
    vault:
      uri: ${VAULT_URI:http://vault:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN:smartconnect-root-token}
      fail-fast: true
      kv:
        enabled: true
        backend: secret
        # secret/data/smartconnect/api-gateway - matches infra/vault/seed.sh
        application-name: smartconnect/api-gateway

    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URI:http://user-service:8081}
          predicates:
            - Path=/api/users/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"
        # Websocket bridge for live user-events -> backoffice-app. Nothing lives behind this
        # route yet (backoffice-app is phase 2) but the shape is wired now per the build order.
        - id: ws-bridge
          uri: ${NOTIFICATION_SERVICE_WS_URI:ws://notification-service:8082}
          predicates:
            - Path=/ws/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userOrIpKeyResolver}"

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  elastic:
    metrics:
      export:
        enabled: true
        host: ${ELASTICSEARCH_HOST:http://elasticsearch:9200}
        index: smartconnect-metrics
        step: 30s

smartconnect:
  environment: ${SMARTCONNECT_ENV:local}

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} [correlationId=%X{correlationId}] - %msg%n"
