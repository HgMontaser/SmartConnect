name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Full reactor build (libs/commons + api-gateway + user-service + notification-service),
      # tests included — this is the gate, not the fast local `-DskipTests` loop.
      - name: Build and test
        run: mvn -B verify

      - name: Upload service jars
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            services/api-gateway/target/*.jar
            services/user-service/target/*.jar
            services/notification-service/target/*.jar
          retention-days: 1

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [login-app, backoffice-app]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - run: npm ci
        working-directory: apps/${{ matrix.app }}

      - run: npm run build
        working-directory: apps/${{ matrix.app }}

  # Single required status check for branch protection — real gate independent of matrix
  # job-name formatting, so protection rules don't break if the matrix changes shape.
  ci-passed:
    name: ci-passed
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require all upstream jobs to have succeeded
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "backend: ${{ needs.backend.result }}"
            echo "frontend: ${{ needs.frontend.result }}"
            exit 1
          fi

  publish-images:
    name: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [ci-passed]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-gateway, user-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      # upload-artifact strips the shared `services/` prefix from the three glob
      # paths (using their common ancestor), so downloading straight to `.` would put
      # jars one directory too shallow — download into `services/` to put it back.
      - uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: services

      - name: Lowercase image owner (GHCR requires it)
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/smartconnect-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/smartconnect-${{ matrix.service }}:develop

  # OKE's node is Ampere A1 (arm64) — GitHub's ubuntu-latest runners are amd64, so this
  # needs an actual cross-platform build (QEMU + buildx), not just a plain docker build.
  publish-oke-images:
    name: publish-oke-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [ci-passed]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, user-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: services

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.OCIR_REGISTRY }}
          username: ${{ vars.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ vars.OCIR_REGISTRY }}/${{ vars.OCIR_NAMESPACE }}/smartconnect-${{ matrix.service }}:${{ github.sha }}
            ${{ vars.OCIR_REGISTRY }}/${{ vars.OCIR_NAMESPACE }}/smartconnect-${{ matrix.service }}:latest

  # Same idea as publish-oke-images, but frontends need their own build (Vite bakes
  # VITE_* env vars in at build time — this is what makes them carry the public
  # Keycloak/gateway hostnames from apps/*/.env.production, not the localhost ones from
  # .env — so this can't just reuse the service-jars artifact the way the backend does).
  publish-oke-frontend-images:
    name: publish-oke-frontend-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [ci-passed]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [login-app, backoffice-app]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - run: npm ci
        working-directory: apps/${{ matrix.app }}

      # Production mode by default — picks up .env.production automatically.
      - run: npm run build
        working-directory: apps/${{ matrix.app }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.OCIR_REGISTRY }}
          username: ${{ vars.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ vars.OCIR_REGISTRY }}/${{ vars.OCIR_NAMESPACE }}/smartconnect-${{ matrix.app }}:${{ github.sha }}
            ${{ vars.OCIR_REGISTRY }}/${{ vars.OCIR_NAMESPACE }}/smartconnect-${{ matrix.app }}:latest

  # Deploys to the real OKE cluster on every push to develop: the infra chart (Vault,
  # Keycloak+Postgres, Redis, Kafka, Elasticsearch) and the app-services chart
  # (api-gateway, user-service, notification-service), using the OCIR images this same
  # workflow just built.
  deploy-oke:
    name: deploy-oke
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [ci-passed, publish-oke-images, publish-oke-frontend-images]
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Install kubectl and Helm
        run: |
          curl -sL https://get.helm.sh/helm-v3.16.2-linux-amd64.tar.gz | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          curl -sL "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Fetch OKE kubeconfig
        run: |
          oci ce cluster create-kubeconfig \
            --cluster-id "${{ secrets.OCI_CLUSTER_ID }}" \
            --file "$HOME/.kube/config" \
            --region "${{ secrets.OCI_CLI_REGION }}" \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          # oci ce doesn't tighten this itself — silences the (harmless here: single-tenant,
          # ephemeral runner, and the file holds an exec reference rather than a static
          # token) "group/world-readable" warning kubectl prints on every step after this.
          chmod 600 "$HOME/.kube/config"

      # Keycloak's realm/theme ConfigMaps are sourced straight from infra/keycloak/ rather
      # than duplicated into the chart (Helm's .Files can only read within the chart
      # directory) — recreate them here on every deploy so an edit to the realm or theme
      # actually reaches the cluster, not just the docker-compose stack.
      - name: Sync Keycloak realm/theme ConfigMaps
        run: |
          kubectl create configmap keycloak-realm-config \
            --from-file=realm-export.json=infra/keycloak/realm-export.json \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap keycloak-theme-login-root \
            --from-file=theme.properties=infra/keycloak/themes/smartconnect/login/theme.properties \
            --from-file=login.ftl=infra/keycloak/themes/smartconnect/login/login.ftl \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap keycloak-theme-login-css \
            --from-file=styles.css=infra/keycloak/themes/smartconnect/login/resources/css/styles.css \
            --dry-run=client -o yaml | kubectl apply -f -

      # Reads the ingress-nginx LoadBalancer's actual current IP rather than trusting the
      # hardcoded default in values.yaml — self-corrects if the LB is ever recreated
      # (ingress-nginx itself is a one-time manual cluster bootstrap step, not part of this
      # workflow, the same as creating the OKE cluster itself isn't).
      - name: Deploy infra chart (Vault, Keycloak, Postgres, Redis, Kafka, Elasticsearch, Ingress)
        run: |
          LB_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          helm upgrade --install smartconnect-infra k8s/smartconnect-infra --set publicIP="$LB_IP" --wait --timeout 5m

      # OCIR repos are private, so the cluster needs its own credential to pull from them —
      # separate from the one this job used above to push (same account, but kept as
      # distinct steps/secrets since a pull-only credential shouldn't need push scope).
      - name: Sync OCIR pull secret
        run: |
          kubectl create secret docker-registry ocir-pull-secret \
            --docker-server="${{ vars.OCIR_REGISTRY }}" \
            --docker-username="${{ vars.OCIR_USERNAME }}" \
            --docker-password="${{ secrets.OCIR_AUTH_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy app-services chart (api-gateway, user-service, notification-service, login-app, backoffice-app)
        run: |
          helm upgrade --install smartconnect-app k8s/smartconnect -f k8s/smartconnect/values-oke.yaml \
            --set services[0].image=${{ vars.OCIR_REGISTRY }}/${{ vars.OCIR_NAMESPACE }}/smartconnect-api-gateway:${{ github.sha }} \
            --set services[1].image=${{ vars.OCIR_REGISTRY }}/${{ vars.OCIR_NAMESPACE }}/smartconnect-user-service:${{ github.sha }} \
            --set services[2].image=${{ vars.OCIR_REGISTRY }}/${{ vars.OCIR_NAMESPACE }}/smartconnect-notification-service:${{ github.sha }} \
            --set services[3].image=${{ vars.OCIR_REGISTRY }}/${{ vars.OCIR_NAMESPACE }}/smartconnect-login-app:${{ github.sha }} \
            --set services[4].image=${{ vars.OCIR_REGISTRY }}/${{ vars.OCIR_NAMESPACE }}/smartconnect-backoffice-app:${{ github.sha }} \
            --wait --timeout 5m

      - name: Verify rollout
        run: kubectl get pods -o wide
