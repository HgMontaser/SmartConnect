name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Full reactor build (libs/commons + api-gateway + user-service + notification-service),
      # tests included — this is the gate, not the fast local `-DskipTests` loop.
      - name: Build and test
        run: mvn -B verify

      - name: Upload service jars
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            services/api-gateway/target/*.jar
            services/user-service/target/*.jar
            services/notification-service/target/*.jar
          retention-days: 1

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [login-app, backoffice-app]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - run: npm ci
        working-directory: apps/${{ matrix.app }}

      - run: npm run build
        working-directory: apps/${{ matrix.app }}

  # Single required status check for branch protection — real gate independent of matrix
  # job-name formatting, so protection rules don't break if the matrix changes shape.
  ci-passed:
    name: ci-passed
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require all upstream jobs to have succeeded
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "backend: ${{ needs.backend.result }}"
            echo "frontend: ${{ needs.frontend.result }}"
            exit 1
          fi

  publish-images:
    name: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [ci-passed]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-gateway, user-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      # upload-artifact strips the shared `services/` prefix from the three glob
      # paths (using their common ancestor), so downloading straight to `.` would put
      # jars one directory too shallow — download into `services/` to put it back.
      - uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: services

      - name: Lowercase image owner (GHCR requires it)
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/smartconnect-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/smartconnect-${{ matrix.service }}:develop

  # Deploys to the real OKE cluster on every push to develop. Scoped to the infra chart
  # (currently just Vault) for now — api-gateway/user-service can't fully boot on OKE yet
  # since Keycloak/Kafka/Redis/Elasticsearch are still docker-compose-only, unreachable from
  # OKE's network. This job is the right shape to extend once that changes: add an OCIR
  # build step (see the arch note below) and a second `helm upgrade` for the app chart.
  deploy-oke:
    name: deploy-oke
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [ci-passed]
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Install kubectl and Helm
        run: |
          curl -sL https://get.helm.sh/helm-v3.16.2-linux-amd64.tar.gz | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          curl -sL "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Fetch OKE kubeconfig
        run: |
          oci ce cluster create-kubeconfig \
            --cluster-id "${{ secrets.OCI_CLUSTER_ID }}" \
            --file "$HOME/.kube/config" \
            --region "${{ secrets.OCI_CLI_REGION }}" \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT

      # Keycloak's realm/theme ConfigMaps are sourced straight from infra/keycloak/ rather
      # than duplicated into the chart (Helm's .Files can only read within the chart
      # directory) — recreate them here on every deploy so an edit to the realm or theme
      # actually reaches the cluster, not just the docker-compose stack.
      - name: Sync Keycloak realm/theme ConfigMaps
        run: |
          kubectl create configmap keycloak-realm-config \
            --from-file=realm-export.json=infra/keycloak/realm-export.json \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap keycloak-theme-login-root \
            --from-file=theme.properties=infra/keycloak/themes/smartconnect/login/theme.properties \
            --from-file=login.ftl=infra/keycloak/themes/smartconnect/login/login.ftl \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap keycloak-theme-login-css \
            --from-file=styles.css=infra/keycloak/themes/smartconnect/login/resources/css/styles.css \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy infra chart (Vault, Keycloak, Postgres)
        run: helm upgrade --install smartconnect-infra k8s/smartconnect-infra --wait --timeout 5m

      - name: Verify rollout
        run: kubectl get pods -o wide
