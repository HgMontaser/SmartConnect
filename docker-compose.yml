networks:
  smartconnect:
    driver: bridge

volumes:
  keycloak-postgres-data:
  kafka-data:
  redis-data:
  es-data:

services:

  # ---------------------------------------------------------------------
  # Secrets
  # ---------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    container_name: smartconnect-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "smartconnect-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    # Dev mode is in-memory: the entrypoint re-seeds on every start (see infra/vault/entrypoint.sh)
    # and the healthcheck only passes once seeding is done.
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./infra/vault/entrypoint.sh:/entrypoint.sh:ro
      - ./infra/vault/seed.sh:/seed.sh:ro
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/seeded && wget -q -O- 'http://127.0.0.1:8200/v1/sys/health?standbyok=true'"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------
  # Service discovery + shared config
  # ---------------------------------------------------------------------
  consul:
    image: hashicorp/consul:1.19
    container_name: smartconnect-consul
    restart: unless-stopped
    ports:
      - "8500:8500"
    # Dev mode is in-memory: the entrypoint loads infra/consul/config into KV on every start
    # (see infra/consul/entrypoint.sh) and the healthcheck only passes once that's done.
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./infra/consul/entrypoint.sh:/entrypoint.sh:ro
      - ./infra/consul/config:/consul-config:ro
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/seeded && consul members"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------
  # Identity
  # ---------------------------------------------------------------------
  keycloak-postgres:
    image: postgres:16-alpine
    container_name: smartconnect-keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: smartconnect-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./infra/keycloak/themes/smartconnect:/opt/keycloak/themes/smartconnect:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------------
  # Messaging
  # ---------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: smartconnect-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,EXTERNAL://0.0.0.0:9092
      # EXTERNAL advertises host.docker.internal rather than localhost: after the initial
      # bootstrap connect, Kafka tells clients to reconnect to this advertised address for
      # actual produce/consume — "localhost" would send a client in another container (e.g.
      # a k8s pod) back to itself instead of the host. host.docker.internal resolves
      # correctly from both other containers and pods; only a client running directly on the
      # Mac host (outside any container) would need localhost, and nothing here does that.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://host.docker.internal:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "smartconnect-kraft-cluster-1"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------
  # Rate limiting store
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: smartconnect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: smartconnect-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: smartconnect-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q 'available'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------------
  # api-gateway
  # ---------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: api-gateway
    container_name: smartconnect-api-gateway
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: smartconnect-root-token
      CONSUL_HOST: consul
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    depends_on:
      vault:
        condition: service_healthy
      consul:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartconnect

  # ---------------------------------------------------------------------
  # user-service
  # ---------------------------------------------------------------------
  user-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: user-service
    container_name: smartconnect-user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: smartconnect-root-token
      CONSUL_HOST: consul
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    depends_on:
      vault:
        condition: service_healthy
      consul:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smartconnect

  # ---------------------------------------------------------------------
  # notification-service
  # ---------------------------------------------------------------------
  notification-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: notification-service
    container_name: smartconnect-notification-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: smartconnect-root-token
      CONSUL_HOST: consul
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    depends_on:
      vault:
        condition: service_healthy
      consul:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smartconnect

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: smartconnect-filebeat
    restart: unless-stopped
    user: root
    command: ["--strict.perms=false"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    volumes:
      - ./infra/elastic/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - smartconnect

  # ---------------------------------------------------------------------
  # Frontends
  # ---------------------------------------------------------------------
  login-app:
    build:
      context: ./apps/login-app
    container_name: smartconnect-login-app
    restart: unless-stopped
    ports:
      - "5173:8080"
    networks:
      - smartconnect

  backoffice-app:
    build:
      context: ./apps/backoffice-app
    container_name: smartconnect-backoffice-app
    restart: unless-stopped
    ports:
      - "5174:8080"
    depends_on:
      - api-gateway
    networks:
      - smartconnect
