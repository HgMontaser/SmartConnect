# No secret lives in this file or in git: secrets-init generates them into the `secrets` volume
# on first run (infra/secrets/init.sh). Each service mounts only its own folder of it.

# Every container logs to json-file explicitly: Filebeat reads those files, and the Docker default
# driver differs per machine (Docker Desktop now defaults to `local`, which Filebeat can't read).

# Example apps (examples/<name>/compose.yml) are included here but only start with their
# profile, e.g. `docker compose --profile demo-app up -d --build`.
include:
  - path: examples/demo-app/compose.yml
  # new-service:includes (scripts/new-service.sh adds example compose files above this line)

networks:
  smartconnect:
    driver: bridge

volumes:
  secrets:
  vault-data:
  keycloak-postgres-data:
  kafka-data:
  redis-data:
  es-data:

services:

  # ---------------------------------------------------------------------
  # Secrets
  # ---------------------------------------------------------------------
  # One-shot: generates missing secrets into the `secrets` volume (never overwrites).
  secrets-init:
    image: alpine:3.20
    container_name: smartconnect-secrets-init
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    entrypoint: ["sh", "/init.sh"]
    volumes:
      - ./infra/secrets/init.sh:/init.sh:ro
      - ./infra/secrets/services.list:/lists/services.list:ro
      - ./examples:/examples:ro
      - secrets:/secrets
    networks:
      - smartconnect

  vault:
    image: hashicorp/vault:1.17
    container_name: smartconnect-vault
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    # Server mode: data persists in vault-data; the entrypoint unseals, configures AppRoles and
    # loads generated secrets on every start, and the healthcheck passes once that's done.
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./infra/vault/entrypoint.sh:/entrypoint.sh:ro
      - ./infra/vault/seed.sh:/seed.sh:ro
      - ./infra/vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/data
      - secrets:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/configured && vault status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---------------------------------------------------------------------
  # Service discovery + shared config
  # ---------------------------------------------------------------------
  consul:
    image: hashicorp/consul:1.19
    container_name: smartconnect-consul
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    ports:
      - "8500:8500"
    # Dev mode is in-memory: the entrypoint loads infra/consul/config into KV on every start
    # (see infra/consul/entrypoint.sh) and the healthcheck only passes once that's done.
    entrypoint: ["sh", "/entrypoint.sh"]
    environment:
      # The CLI (entrypoint, healthcheck) authenticates with the generated root token.
      CONSUL_HTTP_TOKEN_FILE: /secrets/infra/consul-root-token
    volumes:
      - ./infra/consul/entrypoint.sh:/entrypoint.sh:ro
      - ./infra/consul/config:/consul-config:ro
      - secrets:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/seeded && consul members"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------
  # Identity
  # ---------------------------------------------------------------------
  keycloak-postgres:
    image: postgres:16-alpine
    container_name: smartconnect-keycloak-postgres
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: smartconnect-keycloak
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    # jboss-logging at INFO puts every login and admin event in the container log -> Filebeat -> Kibana.
    command: ["start-dev", "--import-realm", "--spi-events-listener--jboss-logging--success-level=info"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./infra/keycloak/themes/smartconnect:/opt/keycloak/themes/smartconnect:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot: realm setup realm-export.json can't apply to an existing database
  # (see infra/keycloak/init.sh). Re-runs, idempotently, on every `docker compose up`.
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.7
    container_name: smartconnect-keycloak-init
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    entrypoint: ["sh", "/init.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/init.sh:/init.sh:ro
      - secrets:/secrets:ro
      - ./infra/keycloak/clients:/clients:ro
      - ./examples:/examples:ro
    depends_on:
      keycloak:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
    networks:
      - smartconnect

  # ---------------------------------------------------------------------
  # Messaging
  # ---------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: smartconnect-kafka
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,EXTERNAL://0.0.0.0:9092
      # EXTERNAL advertises host.docker.internal rather than localhost: after the initial
      # bootstrap connect, Kafka tells clients to reconnect to this advertised address for
      # actual produce/consume — "localhost" would send a client in another container (e.g.
      # a k8s pod) back to itself instead of the host. host.docker.internal resolves
      # correctly from both other containers and pods; only a client running directly on the
      # Mac host (outside any container) would need localhost, and nothing here does that.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://host.docker.internal:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "smartconnect-kraft-cluster-1"
      # Keep the log on the volume: the image's default is /tmp/kraft-combined-logs inside the
      # container, so every recreate lost all topics and events.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------
  # Rate limiting store
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: smartconnect-redis
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: smartconnect-elasticsearch
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: smartconnect-kibana
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - smartconnect
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q 'available'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot: imports the SmartConnect dashboard, saved search and data views into Kibana.
  kibana-init:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: smartconnect-kibana-init
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    entrypoint: ["sh", "/init.sh"]
    environment:
      KIBANA_URL: http://kibana:5601
    volumes:
      - ./infra/kibana/init.sh:/init.sh:ro
      - ./infra/kibana/smartconnect.ndjson:/kibana/smartconnect.ndjson:ro
    depends_on:
      kibana:
        condition: service_healthy
    networks:
      - smartconnect

  # Distributed tracing: services send OTLP spans here; UI on http://localhost:16686.
  # In-memory storage - traces are gone after a restart, which is fine for local work.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: smartconnect-jaeger
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "20000"
    ports:
      - "16686:16686"
    networks:
      - smartconnect

  # ---------------------------------------------------------------------
  # api-gateway
  # ---------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        MODULE: services/api-gateway
    container_name: smartconnect-api-gateway
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      VAULT_URI: http://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/smartconnect/vault-role-id
      VAULT_SECRET_ID_FILE: /run/secrets/smartconnect/vault-secret-id
      CONSUL_HOST: consul
      CONSUL_TOKEN_FILE: /run/secrets/smartconnect/consul-token
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    depends_on:
      vault:
        condition: service_healthy
      consul:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Only this service's own credentials (consul-token, vault-role-id/secret-id).
      - type: volume
        source: secrets
        target: /run/secrets/smartconnect
        read_only: true
        volume:
          subpath: services/api-gateway
    networks:
      - smartconnect

  # ---------------------------------------------------------------------
  # user-service
  # ---------------------------------------------------------------------
  user-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        MODULE: services/user-service
    container_name: smartconnect-user-service
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      VAULT_URI: http://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/smartconnect/vault-role-id
      VAULT_SECRET_ID_FILE: /run/secrets/smartconnect/vault-secret-id
      CONSUL_HOST: consul
      CONSUL_TOKEN_FILE: /run/secrets/smartconnect/consul-token
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    depends_on:
      vault:
        condition: service_healthy
      consul:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    volumes:
      # Only this service's own credentials (consul-token, vault-role-id/secret-id).
      - type: volume
        source: secrets
        target: /run/secrets/smartconnect
        read_only: true
        volume:
          subpath: services/user-service
    networks:
      - smartconnect

  # ---------------------------------------------------------------------
  # notification-service
  # ---------------------------------------------------------------------
  notification-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        MODULE: services/notification-service
    container_name: smartconnect-notification-service
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      VAULT_URI: http://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/smartconnect/vault-role-id
      VAULT_SECRET_ID_FILE: /run/secrets/smartconnect/vault-secret-id
      CONSUL_HOST: consul
      CONSUL_TOKEN_FILE: /run/secrets/smartconnect/consul-token
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    depends_on:
      vault:
        condition: service_healthy
      consul:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      # Only this service's own credentials (consul-token, vault-role-id/secret-id).
      - type: volume
        source: secrets
        target: /run/secrets/smartconnect
        read_only: true
        volume:
          subpath: services/notification-service
    networks:
      - smartconnect

  # new-service:services (scripts/new-service.sh adds platform services above this line)

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: smartconnect-filebeat
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    user: root
    command: ["--strict.perms=false"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    volumes:
      - ./infra/elastic/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - smartconnect

  # ---------------------------------------------------------------------
  # Frontends
  # ---------------------------------------------------------------------
  login-app:
    build:
      context: ./apps/login-app
    container_name: smartconnect-login-app
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    ports:
      - "5173:8080"
    networks:
      - smartconnect

  backoffice-app:
    build:
      context: ./apps/backoffice-app
    container_name: smartconnect-backoffice-app
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
    ports:
      - "5174:8080"
    depends_on:
      - api-gateway
    networks:
      - smartconnect
