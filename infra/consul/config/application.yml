# Shared, non-secret config for every service (Consul KV: config/application/data).
# Secrets never go here - they live in Vault. Edits here apply on `docker compose restart consul`;
# edits in the Consul UI apply live but are overwritten on the next restart.
smartconnect:
  environment: local

# Distributed tracing: every service sends spans to Jaeger (UI: http://localhost:16686).
# Sample everything locally; lower this in production.
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

# One log format fleet-wide, with trace/span ids so a trace in Jaeger leads to its logs in Kibana.
logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} [trace=%X{traceId:-} span=%X{spanId:-} correlationId=%X{correlationId:-}] - %msg%n"

spring:
  kafka:
    # Trace context travels in Kafka record headers, so a trace continues from producer to consumer.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Container-internal issuer used to fetch Keycloak's signing keys. Tokens minted for
          # browsers (iss = http://localhost:8080/...) are accepted too - see commons security.
          issuer-uri: http://keycloak:8080/realms/smartconnect
      client:
        provider:
          # Token endpoint for services calling others as themselves (ServiceClients.asService()).
          smartconnect:
            token-uri: http://keycloak:8080/realms/smartconnect/protocol/openid-connect/token
