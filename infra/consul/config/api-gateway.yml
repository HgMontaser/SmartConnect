# api-gateway's non-secret config (Consul KV: config/api-gateway/data).
smartconnect:
  gateway:
    # Applied to every discovered route; changes refresh the routes without a restart.
    rate-limit:
      replenish-rate: 10
      burst-capacity: 20
  commons:
    security:
      cors:
        # Any local port in dev, so new frontends work without touching this. List exact
        # origins in production.
        allowed-origins: http://localhost:[*]
