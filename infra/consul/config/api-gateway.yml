# api-gateway's non-secret config (Consul KV: config/api-gateway/data).
spring:
  reactor:
    # Carries the trace context across reactive operators so gateway spans and logs line up.
    context-propagation: auto
  cloud:
    gateway:
      httpclient:
        # Defaults for every route; a service can raise its own with smartconnect.gateway.timeout.
        connect-timeout: 2000
        response-timeout: 10s
      # The gateway and the service behind it both answer with X-Correlation-Id (the same value,
      # since the gateway forwards it); return it once.
      default-filters:
        - DedupeResponseHeader=X-Correlation-Id, RETAIN_FIRST
    circuitbreaker:
      resilience4j:
        # The gateway's response timeout decides when a call is too slow (Resilience4j's own
        # time limiter defaults to 1s and would cut off slower endpoints).
        disable-time-limiter: true

# Circuit breaker for every discovered route (one instance per service). Override a single
# service under resilience4j.circuitbreaker.instances.<service-name>.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

smartconnect:
  gateway:
    # Applied to every discovered route; changes refresh the routes without a restart.
    rate-limit:
      replenish-rate: 10
      burst-capacity: 20
  commons:
    security:
      cors:
        # Any local port in dev, so new frontends work without touching this. List exact
        # origins in production.
        allowed-origins: http://localhost:[*]
