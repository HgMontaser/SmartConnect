{{- range .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      {{- if $.Values.keycloakHostAliasIP }}
      # Only needed for the local kind trial: Vault's stored config bakes in the
      # docker-compose hostname "keycloak" (JWT issuer-uri, and for user-service the admin
      # API base URL too), which a plain env var can't override since it lives inside the
      # secret value itself. On OKE this isn't needed at all — Keycloak is in-cluster, so
      # the plain Service name "keycloak" already resolves correctly.
      hostAliases:
        - ip: {{ $.Values.keycloakHostAliasIP }}
          hostnames:
            - keycloak
      {{- end }}
      {{- if $.Values.imagePullSecret }}
      # OCIR repos are private (my OCI CLI token lacks the scope to make them public) — the
      # local kind trial doesn't need this at all, since kind load docker-image sideloads
      # images directly and never pulls from a registry.
      imagePullSecrets:
        - name: {{ $.Values.imagePullSecret }}
      {{- end }}
      containers:
        - name: {{ .name }}
          image: {{ .image }}
          imagePullPolicy: {{ .imagePullPolicy }}
          ports:
            - containerPort: {{ .port }}
          env:
            {{- range $key, $value := .env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          # healthPath defaults to the Spring Boot actuator paths every backend service
          # exposes; the two nginx-served frontends set it to "/" instead, since they have
          # no actuator endpoint.
          readinessProbe:
            httpGet:
              path: {{ .healthPath | default "/actuator/health/readiness" }}
              port: {{ .port }}
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .healthPath | default "/actuator/health/liveness" }}
              port: {{ .port }}
            initialDelaySeconds: 20
            periodSeconds: 10
---
{{- end }}
