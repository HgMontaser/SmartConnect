apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          # Fully-qualified — this node's CRI-O runtime runs with short-name-mode=enforcing
          # and refuses to guess a registry for an unqualified name like "hashicorp/vault".
          image: docker.io/hashicorp/vault:1.17
          # Same dev-mode setup as docker-compose (in-memory, wiped on restart) — this
          # migration is parity with what's running locally, not a hardening pass. Real
          # persistence/auto-unseal is a separate follow-up before any real customer data.
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: "smartconnect-root-token"
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
          ports:
            - containerPort: 8200
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vault
spec:
  # ClusterIP only — Vault holds secrets, no reason to expose it outside the cluster.
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200
