apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  labels:
    app: elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      # Elasticsearch checks this at startup and refuses to run as an arbitrary UID without
      # it — matches the container's own default (uid 1000), just made explicit since some
      # CRI-O/OKE node defaults differ from plain Docker.
      securityContext:
        fsGroup: 1000
      initContainers:
        # ES wants vm.max_map_count >= 262144; the OKE node's default is lower. A privileged
        # init container is the standard way to raise a host sysctl before the real
        # container starts, since Elasticsearch's own container isn't privileged.
        - name: sysctl
          image: docker.io/library/busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - containerPort: 9200
          # No persistent volume — same free-tier tradeoff as Kafka/Redis. Metrics/logs reset
          # on a pod restart; acceptable for this trial.
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 45
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
spec:
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
